<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Federal UGLs y Agencias - PAMI</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-canvas: #090d16;
            --bg-sidebar: #0f1420;
            --bg-card: #161c2e;
            --bg-input: #070a10;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --c-central: #3b82f6;
            --c-ugl: #10b981;
            --c-agencia: #f59e0b;
            --c-vacio: #475569;
            --c-alerta: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0; display: flex; height: 100vh;
            background: var(--bg-canvas); color: var(--text-main); overflow: hidden;
        }
        #zona-grafo { flex: 1; position: relative; min-width: 0; }
        #contenedor-grafo { width: 100%; height: 100%; }

        /* Leyenda + filtros */
        #leyenda {
            position: absolute; left: 16px; top: 16px; z-index: 5;
            background: rgba(15, 20, 32, 0.92); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px 12px; font-size: 0.78rem; color: var(--text-muted);
        }
        #leyenda label { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; user-select: none; }
        #leyenda input { accent-color: var(--c-central); margin: 0; }
        .sw { width: 11px; height: 11px; display: inline-block; flex-shrink: 0; }
        .sw.central { background: var(--c-central); border-radius: 50%; }
        .sw.ugl { background: var(--c-ugl); border-radius: 50%; }
        .sw.agencia { background: var(--c-agencia); transform: rotate(45deg) scale(.85); }
        .sw.vacio { background: var(--c-vacio); border-radius: 50%; }

        #panel-lateral {
            width: 420px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; z-index: 10; box-shadow: -10px 0 30px rgba(0,0,0,.5);
        }
        .cabecera-panel { padding: 22px 20px 16px; border-bottom: 1px solid var(--border-color); }
        .cabecera-panel h2 { margin: 0 0 12px; font-size: 1.15rem; font-weight: 600; }
        .buscador-input {
            width: 100%; padding: 9px 14px; background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 6px; font-size: .88rem; color: var(--text-main); outline: none;
        }
        .buscador-input:focus { border-color: var(--c-central); }
        .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .badge { font-size: .72rem; padding: 3px 9px; border-radius: 10px; font-weight: 600; border: 1px solid; }
        .badge.ugl { color: var(--c-ugl); border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.1); }
        .badge.agencia { color: var(--c-agencia); border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.1); }
        .badge.alerta { color: var(--c-alerta); border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.1); cursor: pointer; }

        #contenido-detalles { padding: 20px; overflow-y: auto; flex: 1; }
        #contenido-detalles::-webkit-scrollbar { width: 5px; }
        #contenido-detalles::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .mensaje-vacio { color: var(--text-muted); font-style: italic; text-align: center; margin-top: 60px; font-size: .88rem; line-height: 1.6; }
        .tipo-chip { display: inline-block; font-size: .66rem; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
        .tipo-chip.ugl { background: rgba(16,185,129,.15); color: var(--c-ugl); }
        .tipo-chip.agencia { background: rgba(245,158,11,.15); color: var(--c-agencia); }
        .titulo-nodo { font-size: 1.2rem; font-weight: 600; margin: 0 0 4px; }
        .subtitulo-nodo { font-size: .82rem; color: var(--text-muted); margin: 0 0 18px; }
        .subtitulo-nodo a { color: var(--c-ugl); cursor: pointer; text-decoration: none; }
        .subtitulo-nodo a:hover { text-decoration: underline; }

        .seccion-titulo { font-size: .72rem; text-transform: uppercase; letter-spacing: .9px; color: var(--text-muted); margin: 18px 0 8px; font-weight: 700; }
        .datos-contacto { background: var(--bg-card); border: 1px solid var(--border-color); border-left: 3px solid var(--c-central); padding: 10px 14px; border-radius: 6px; }
        .datos-contacto p { margin: 6px 0; font-size: .85rem; color: #cbd5e1; display: flex; align-items: flex-start; }
        .datos-contacto .enlace-mapa { color: #60a5fa; text-decoration: none; }
        .datos-contacto .enlace-mapa:hover { text-decoration: underline; }
        .datos-contacto .dato-oficial { font-size: .7rem !important; color: var(--text-muted) !important; margin-top: 8px !important; border-top: 1px solid var(--border-color); padding-top: 7px; }
        .datos-contacto .pendiente { color: var(--text-muted); font-style: italic; }
        .icon-svg { width: 15px; height: 15px; margin-right: 8px; flex-shrink: 0; margin-top: 2px; }

        .tarjeta-cargo { background: var(--bg-card); border: 1px solid var(--border-color); border-left: 3px solid var(--c-ugl); padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; }
        .tarjeta-cargo.agencia { border-left-color: var(--c-agencia); }
        .cargo-titulo { font-size: .7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 3px; letter-spacing: .4px; }
        .cargo-nombre { font-size: .95rem; font-weight: 600; margin: 0; }
        .cargo-alerta { font-size: .72rem; color: var(--c-alerta); margin-top: 4px; }

        .lista-hijos { display: flex; flex-direction: column; gap: 6px; }
        .item-hijo {
            display: flex; align-items: center; gap: 10px; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: .86rem; transition: border-color .15s;
        }
        .item-hijo:hover { border-color: #334155; }
        .item-hijo .n { color: var(--text-muted); font-size: .75rem; margin-left: auto; white-space: nowrap; }

        .resultado { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: .86rem; }
        .resultado:hover { background: var(--bg-card); }
        .resultado small { color: var(--text-muted); margin-left: auto; font-size: .72rem; white-space: nowrap; }

        /* Divisor arrastrable entre grafo y panel */
        #divisor {
            width: 6px; margin: 0 -3px; cursor: col-resize; z-index: 20; position: relative; flex-shrink: 0;
            background: transparent; transition: background .15s;
        }
        #divisor::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 2px; height: 36px; border-radius: 2px; background: #334155; transition: background .15s;
        }
        #divisor:hover, #divisor.activo { background: rgba(59,130,246,.25); }
        #divisor:hover::after, #divisor.activo::after { background: var(--c-central); }
        body.redimensionando { cursor: col-resize; user-select: none; }
        body.redimensionando #contenedor-grafo { pointer-events: none; }

        /* Buscador rápido sobre el grafo */
        #buscador-rapido { position: absolute; top: 16px; right: 16px; z-index: 6; width: 260px; }
        #buscador-rapido .caja {
            display: flex; align-items: center; gap: 8px; background: rgba(15,20,32,.92);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 7px 10px; transition: border-color .2s;
        }
        #buscador-rapido .caja:focus-within { border-color: var(--c-central); }
        #buscador-rapido input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text-main); font-size: .82rem; font-family: inherit; }
        #buscador-rapido input::placeholder { color: #64748b; }
        #buscador-rapido .lupa { width: 14px; height: 14px; flex-shrink: 0; }
        #sugerencias {
            display: none; margin-top: 6px; max-height: 320px; overflow-y: auto; background: rgba(15,20,32,.97);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }
        #sugerencias.visible { display: block; }
        #sugerencias::-webkit-scrollbar { width: 5px; }
        #sugerencias::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .sug { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 5px; cursor: pointer; font-size: .82rem; }
        .sug:hover, .sug.activa { background: var(--bg-card); }
        .sug .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sug small { margin-left: auto; color: var(--text-muted); font-size: .7rem; white-space: nowrap; padding-left: 6px; }
        .sug-vacio { padding: 8px; font-size: .8rem; color: var(--text-muted); font-style: italic; }
        code { background: var(--bg-card); padding: 1px 5px; border-radius: 3px; font-size: .8rem; }

        @media (max-width: 800px) {
            body { flex-direction: column; }
            #zona-grafo { height: 50vh; flex: none; }
            #divisor { display: none; }
            #buscador-rapido { left: 16px; right: 16px; top: auto; bottom: 12px; width: auto; }
            #panel-lateral { width: 100% !important; flex: 1; min-height: 0; border-left: none; border-top: 1px solid var(--border-color); }
        }

        /* ================= INTRO DAR SALUD ================= */
        #intro {
            --ds-azul: #0032a1; --ds-azul-osc: #00247a; --ds-turquesa: #00edcf;
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 42%, var(--ds-azul) 0%, var(--ds-azul-osc) 100%);
            transition: opacity .7s ease, visibility .7s;
            cursor: pointer;
        }
        #intro.salida { opacity: 0; visibility: hidden; }
        #intro .logo-wrap { position: relative; display: flex; justify-content: center; }
        #intro .halo {
            --d: calc(min(250px, 58vw) * .37); /* diámetro del círculo del ícono */
            position: absolute; top: 0; left: 50%; width: var(--d); height: var(--d); margin-left: calc(var(--d) / -2);
            border-radius: 50%; border: 2px solid var(--ds-turquesa); opacity: 0;
            animation: intro-halo 1.6s .5s ease-out forwards;
        }
        #intro img {
            width: min(250px, 58vw); height: auto; display: block;
            opacity: 0; transform: translateY(10px) scale(.94); filter: blur(6px);
            animation: intro-logo 1s .15s cubic-bezier(.2,.7,.2,1) forwards;
        }
        #intro .barra {
            width: 120px; height: 2px; margin-top: 34px; border-radius: 2px;
            background: rgba(255,255,255,.14); overflow: hidden;
            opacity: 0; animation: intro-aparecer .4s .9s ease forwards;
        }
        #intro .barra i {
            display: block; height: 100%; width: 100%; background: var(--ds-turquesa);
            transform: scaleX(0); transform-origin: left;
            animation: intro-cargar 1.8s 1s cubic-bezier(.6,0,.3,1) forwards;
        }
        #intro .credito {
            position: absolute; bottom: 32px; left: 16px; right: 16px; text-align: center;
            font-style: italic; font-size: .82rem; letter-spacing: .3px; color: rgba(255,255,255,.72);
            opacity: 0; animation: intro-aparecer .8s 1.3s ease forwards;
        }
        #intro.salida img { transform: scale(1.04); transition: transform .7s ease; }
        @keyframes intro-logo { to { opacity: 1; transform: none; filter: none; } }
        @keyframes intro-halo { 0% { opacity: .55; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.9); } }
        @keyframes intro-cargar { to { transform: scaleX(1); } }
        @keyframes intro-aparecer { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            #intro *, #intro { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .2s !important; }
        }
    </style>
</head>
<body>

<!-- Intro animada Dar Salud (clic o Esc para saltear) -->
<div id="intro" role="presentation" aria-hidden="true">
    <div class="logo-wrap">
        <span class="halo"></span>
        <img src="logo_darsalud.png" alt="DarSalud">
    </div>
    <div class="barra"><i></i></div>
    <div class="credito">Dise&ntilde;o y desarrollo: Leandro Sesto - 2026</div>
</div>

<div id="zona-grafo">
    <div id="contenedor-grafo"></div>
    <div id="leyenda">
        <label><span class="sw central"></span>PAMI Nivel Central</label>
        <label><span class="sw ugl"></span>UGL con datos</label>
        <label><span class="sw vacio"></span>UGL sin datos</label>
        <label><input type="checkbox" id="chkAgencias" checked><span class="sw agencia"></span>Agencias</label>
    </div>
    <div id="buscador-rapido">
        <div class="caja">
            <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input type="text" id="busquedaRapida" placeholder="Ir a UGL, localidad o agencia..." autocomplete="off" spellcheck="false">
        </div>
        <div id="sugerencias"></div>
    </div>
</div>

<div id="divisor" title="Arrastr&aacute; para cambiar el ancho"></div>

<div id="panel-lateral">
    <div class="cabecera-panel">
        <h2>Red Federal UGLs y Agencias</h2>
        <input type="text" id="buscador" class="buscador-input" placeholder="Buscar UGL, Agencia o persona..." autocomplete="off">
        <div class="badges" id="estadisticas"><span class="badge ugl">Cargando...</span></div>
    </div>
    <div id="contenido-detalles">
        <div class="mensaje-vacio">Seleccion&aacute; una UGL en el grafo para desplegar sus datos, autoridades y sus Agencias asociadas.</div>
    </div>
</div>

<script>
/* =====================================================================
   1. CATÁLOGO OFICIAL DE UGLs
   Fuente: institucional.pami.org.ar/files/programaDesarrolloPrestadores/contactos_UGL.pdf
   "alias" = variantes con que aparecen en datos_ugl.json (sin tildes, en mayúsculas).
   ===================================================================== */
const CATALOGO_UGL = [
    { num: 'I',       nombre: 'Tucumán',             alias: ['TUCUMAN'] },
    { num: 'II',      nombre: 'Corrientes',          alias: ['CORRIENTES'] },
    { num: 'III',     nombre: 'Córdoba',             alias: ['CORDOBA'] },
    { num: 'IV',      nombre: 'Mendoza',             alias: ['MENDOZA'] },
    { num: 'V',       nombre: 'Bahía Blanca',        alias: ['BAHIA BLANCA'] },
    { num: 'VI',      nombre: 'Capital Federal',     alias: ['CAPITAL FEDERAL', 'CIUDAD AUTONOMA DE BUENOS AIRES', 'CABA'] },
    { num: 'VII',     nombre: 'La Plata',            alias: ['LA PLATA'] },
    { num: 'VIII',    nombre: 'San Martín',          alias: ['SAN MARTIN'] },
    { num: 'IX',      nombre: 'Rosario',             alias: ['ROSARIO'] },
    { num: 'X',       nombre: 'Lanús',               alias: ['LANUS'] },
    { num: 'XI',      nombre: 'Mar del Plata',       alias: ['MAR DEL PLATA'] },
    { num: 'XII',     nombre: 'Salta',               alias: ['SALTA'] },
    { num: 'XIII',    nombre: 'Chaco',               alias: ['CHACO'] },
    { num: 'XIV',     nombre: 'Entre Ríos',          alias: ['ENTRE RIOS', 'PARANA'] },
    { num: 'XV',      nombre: 'Santa Fe',            alias: ['SANTA FE'] },
    { num: 'XVI',     nombre: 'Neuquén',             alias: ['NEUQUEN'] },
    { num: 'XVII',    nombre: 'Chubut',              alias: ['CHUBUT'] },
    { num: 'XVIII',   nombre: 'Misiones',            alias: ['MISIONES'] },
    { num: 'XIX',     nombre: 'Santiago del Estero', alias: ['SANTIAGO DEL ESTERO'] },
    { num: 'XX',      nombre: 'La Pampa',            alias: ['LA PAMPA'] },
    { num: 'XXI',     nombre: 'San Juan',            alias: ['SAN JUAN'] },
    { num: 'XXII',    nombre: 'Jujuy',               alias: ['JUJUY'] },
    { num: 'XXIII',   nombre: 'Formosa',             alias: ['FORMOSA'] },
    { num: 'XXIV',    nombre: 'Catamarca',           alias: ['CATAMARCA'] },
    { num: 'XXV',     nombre: 'La Rioja',            alias: ['LA RIOJA'] },
    { num: 'XXVI',    nombre: 'San Luis',            alias: ['SAN LUIS'] },
    { num: 'XXVII',   nombre: 'Río Negro',           alias: ['RIO NEGRO'] },
    { num: 'XXVIII',  nombre: 'Santa Cruz',          alias: ['SANTA CRUZ'] },
    { num: 'XXIX',    nombre: 'Morón',               alias: ['MORON'] },
    { num: 'XXX',     nombre: 'Azul',                alias: ['AZUL'] },
    { num: 'XXXI',    nombre: 'Junín',               alias: ['JUNIN'] },
    { num: 'XXXII',   nombre: 'Luján',               alias: ['LUJAN'] },
    { num: 'XXXIII',  nombre: 'Tierra del Fuego',    alias: ['TIERRA DEL FUEGO'] },
    { num: 'XXXIV',   nombre: 'Concordia',           alias: ['CONCORDIA'] },
    { num: 'XXXV',    nombre: 'San Justo',           alias: ['SAN JUSTO'] },
    { num: 'XXXVI',   nombre: 'Río Cuarto',          alias: ['RIO CUARTO', 'RIO IV'] },
    { num: 'XXXVII',  nombre: 'Quilmes',             alias: ['QUILMES'] },
    { num: 'XXXVIII', nombre: 'Chivilcoy',           alias: ['CHIVILCOY'] }
];

/* Claves del JSON que en realidad son la localidad de una Agencia (el LLM las
   cargó como si fueran UGL). Se cuelgan de su UGL real como Agencia.
   Agregar acá cualquier localidad nueva que aparezca como "Sin clasificar". */
const LOCALIDAD_A_UGL = {
    'PUERTO DESEADO': 'XXVIII', 'GOBERNADOR GREGORES': 'XXVIII', 'CALETA OLIVIA': 'XXVIII',
    'SAN JULIAN': 'XXVIII', 'PUERTO SANTA CRUZ': 'XXVIII',
    'BANDERA': 'XIX', 'MONTE QUEMADO': 'XIX', 'TINTINA': 'XIX', 'OJO DE AGUA': 'XIX',
    'FRIAS': 'XIX', 'CAMPO GALLO': 'XIX', 'ANATUYA': 'XIX', 'LA BANDA': 'XIX'
};

/* Cargos genéricos: si la misma persona ya figura en una Agencia de esa UGL, se descartan */
const CARGOS_GENERICOS = /^(titular|designad[ao]|prestar servicios|prestador(a)? de servicios|desempe[nñ]ar tareas)$/i;

/* =====================================================================
   2. NORMALIZACIÓN: datos_ugl.json (plano) -> árbol UGL > Agencias (los CAP también se tratan como Agencia)
   ===================================================================== */
const sinTildes = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const clave = s => sinTildes(String(s)).toUpperCase().replace(/[“”"'«»]/g, '').replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CONECTORES = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'e']);
const nombreBonito = s => {
    // "Natalia Ivana CLEPPE" -> "Natalia Ivana Cleppe"; "OJO DE AGUA" -> "Ojo de Agua"
    return String(s).trim().split(/\s+/).map((p, i) => {
        if (p !== p.toUpperCase() || !/[A-ZÁÉÍÓÚÑ]/.test(p)) return p;          // ya viene en formato mixto
        const low = p.toLowerCase();
        if (i > 0 && CONECTORES.has(low)) return low;
        return low.charAt(0).toUpperCase() + low.slice(1);
    }).join(' ');
};
const tieneTildes = s => s !== sinTildes(s);
const valorBasura = v => !v || /^EN CABA$/i.test(v.trim()) || /^\(?0\)?\s*0?$/.test(v.trim());

function resolverUGL(claveJson) {
    // Quita prefijos "UGLXI – ", "XXVIII - ", "UGL VI - "
    const limpia = clave(claveJson).replace(/^(UGL\s*)?[IVXL]+\s*[-–—]\s*/, '').trim();
    for (const u of CATALOGO_UGL) if (u.alias.includes(limpia)) return { ugl: u, localidad: null };
    if (LOCALIDAD_A_UGL[limpia]) {
        const u = CATALOGO_UGL.find(x => x.num === LOCALIDAD_A_UGL[limpia]);
        return { ugl: u, localidad: limpia };
    }
    return { ugl: null, localidad: limpia };
}

// Detecta si un cargo pertenece a una Agencia (incluye CAP y Bocas de Atención). Devuelve {tipo, nombre, rol} o null.
function clasificarCargo(cargo) {
    const txt = cargo.replace(/\s+/g, ' ').trim();
    let m = txt.match(/^(.*?)\b(?:CAP|Centro de Atenci[oó]n Personalizada)\b(?:\s+Cabecera)?\s*(.*)$/i);
    if (m) return { tipo: 'agencia', nombre: cortarNombre(m[2]), rol: limpiarRol(m[1]) };
    m = txt.match(/^(.*?)\b(?:Agencia|Boca de Atenci[oó]n)\b(?:\s+PAMI)?\s*(.*)$/i);
    if (m && m[2]) return { tipo: 'agencia', nombre: cortarNombre(m[2]), rol: limpiarRol(m[1]), boca: /boca/i.test(txt) };
    return null;
}
function cortarNombre(s) {
    return s.replace(/\(.*?\)/g, '').split(/[,;]/)[0].replace(/[“”"]/g, '').trim();
}
function limpiarRol(s) {
    let r = s.replace(/[\s,\-–]+$/, '').replace(/\s+(de la|del|de|en el|en la|en)$/i, '').trim();
    if (!r || /^titular$/i.test(r)) return 'Titular';
    return r.charAt(0).toUpperCase() + r.slice(1);
}

function construirModelo(datos) {
    const ugls = new Map();   // num -> nodo UGL
    const sinClasificar = []; // claves que no pudimos ubicar
    const obtenerUgl = u => {
        if (!ugls.has(u.num)) ugls.set(u.num, {
            id: 'UGL-' + u.num, tipo: 'ugl', num: u.num, nombre: u.nombre,
            direccion: null, telefono: null, autoridades: new Map(), hijos: new Map(), claves: []
        });
        return ugls.get(u.num);
    };
    // Registra persona en un mapa cargo -> [personas únicas]
    const agregarPersona = (mapa, cargo, persona) => {
        const k = clave(cargo);
        if (!mapa.has(k)) mapa.set(k, { cargo, personas: [] });
        const e = mapa.get(k);
        if (!e.personas.some(p => clave(p) === clave(persona))) e.personas.push(nombreBonito(persona));
    };
    const obtenerHijo = (ugl, tipo, nombre) => {
        const k = tipo + ':' + clave(nombre);
        if (!ugl.hijos.has(k)) ugl.hijos.set(k, {
            id: ugl.id + '|' + k, tipo, nombre: nombreBonito(nombre), ugl, autoridades: new Map()
        });
        const h = ugl.hijos.get(k);
        if (tieneTildes(nombre) && !tieneTildes(h.nombre)) h.nombre = nombreBonito(nombre); // "Pigue" -> "Pigué"
        return h;
    };

    // Todas las UGLs del catálogo aparecen, aunque no tengan datos
    CATALOGO_UGL.forEach(obtenerUgl);

    for (const [claveJson, info] of Object.entries(datos)) {
        const { ugl: u, localidad } = resolverUGL(claveJson);
        if (!u) { sinClasificar.push({ clave: claveJson, info }); continue; }
        const ugl = obtenerUgl(u);
        ugl.claves.push(claveJson);

        for (const [cargo, valor] of Object.entries(info || {})) {
            if (cargo === '_direccion') { if (!valorBasura(valor) && !localidad) ugl.direccion = valor; continue; }
            if (cargo === '_telefono')  { if (!valorBasura(valor) && !localidad) ugl.telefono = valor; continue; }
            if (cargo.startsWith('_') || !valor) continue;

            let c = clasificarCargo(cargo);
            // Clave-localidad (ej. "BANDERA") con cargo genérico -> es la Agencia de esa localidad
            if (!c?.nombre && localidad) c = { tipo: 'agencia', nombre: localidad, rol: c?.rol || limpiarRol(cargo) };
            if (c && c.nombre) {
                const hijo = obtenerHijo(ugl, c.tipo, c.nombre);
                if (c.boca) hijo.subtipo = 'Boca de Atención';
                agregarPersona(hijo.autoridades, c.rol, valor);
            } else {
                agregarPersona(ugl.autoridades, cargo.charAt(0).toUpperCase() + cargo.slice(1), valor);
            }
        }
    }

    // Limpieza: cargos genéricos de UGL cuya persona ya está en una Agencia
    for (const ugl of ugls.values()) {
        const enHijos = new Set();
        ugl.hijos.forEach(h => h.autoridades.forEach(a => a.personas.forEach(p => enHijos.add(clave(p)))));
        for (const [k, a] of [...ugl.autoridades]) {
            if (CARGOS_GENERICOS.test(a.cargo.trim())) {
                a.personas = a.personas.filter(p => !enHijos.has(clave(p)));
                if (!a.personas.length) ugl.autoridades.delete(k);
            }
        }
    }
    return { ugls: [...ugls.values()], sinClasificar };
}


/* =====================================================================
   2b. CRUCE CON EL LISTADO OFICIAL DE AGENCIAS (directorio_agencias.json)
   Se genera con importar_listado_agencias.py a partir del Excel de PAMI.
   Solo completa datos que faltan: nunca pisa lo que ya viene de datos_ugl.json.
   ===================================================================== */
const ABREVIATURAS = [[/\bPTO\b/g, 'PUERTO'], [/\bGOB\b/g, 'GOBERNADOR'], [/\bGRAL\b/g, 'GENERAL'],
                      [/\bCNEL\b/g, 'CORONEL'], [/\bSTA\b/g, 'SANTA'], [/\bSTGO\b/g, 'SANTIAGO']];
function claveLugar(s) {
    let k = clave(s)
        .replace(/^UGL\s+[IVXL]+\s*[-–]\s*/, '')
        .replace(/^(AGENCIA|BOCA DE ATENCION|BOCA COMPLEMENTARIA|BOCA|C\.?\s?A\.?\s?P\.?|CENTRO DE ATENCION PERSONALIZADA)\s*/, '')
        .replace(/\bPAMI\b/g, '');
    for (const [re, rep] of ABREVIATURAS) k = k.replace(re, rep);
    return k.replace(/Z/g, 'S').replace(/[^A-Z0-9]/g, '');   // Gonzalez/Gonzales, Chavez/Chaves
}

function buscarEnDirectorio(lista, hijo) {
    const k = claveLugar(hijo.nombre);
    if (!k) return null;
    const candidatos = lista.filter(e => e.tipo !== 'ugl');
    const ordenar = arr => arr.sort((a, b) => (b.tipo === 'agencia') - (a.tipo === 'agencia'))[0] || null;
    // 1) nombre exacto  2) localidad exacta  3) uno contiene al otro (mín. 5 letras)
    return ordenar(candidatos.filter(e => claveLugar(e.nombre) === k))
        || ordenar(candidatos.filter(e => claveLugar(e.localidad) === k))
        || (k.length >= 5 ? ordenar(candidatos.filter(e => {
                const n = claveLugar(e.nombre);
                return n.length >= 5 && (n.includes(k) || k.includes(n));
            })) : null);
}

function copiarUbicacion(destino, e) {
    if (!destino.direccion && e.domicilio) destino.direccion = e.domicilio;
    destino.localidad = destino.localidad || e.localidad;
    if (destino.lat == null && e.lat != null) { destino.lat = e.lat; destino.lon = e.lon; }
    destino.codigoPami = e.codigo;
    destino.nombreOficial = e.nombre;
}

function enriquecerConDirectorio(modelo, dir) {
    const reporte = { completadas: [], sinCoincidencia: [] };
    for (const u of modelo.ugls) {
        const lista = dir[u.num] || [];
        const sede = lista.find(e => e.tipo === 'ugl');
        if (sede) copiarUbicacion(u, sede);
        for (const h of u.hijos.values()) {
            const e = buscarEnDirectorio(lista, h);
            if (e) { copiarUbicacion(h, e); reporte.completadas.push(`UGL ${u.num} · ${h.nombre} → ${e.nombre}`); }
            else reporte.sinCoincidencia.push(`UGL ${u.num} · ${h.tipo.toUpperCase()} ${h.nombre}`);
        }
    }
    modelo.reporteDirectorio = reporte;
    if (reporte.sinCoincidencia.length) console.info('Sin coincidencia en el listado oficial:', reporte.sinCoincidencia);
}

        for (const h of u.hijos.values()) {
            indice.set(h.id, h);
            nAg++;
            const c = COLORES[h.tipo];
            nodos.push({
                id: h.id, tipo: h.tipo, label: h.nombre,
                shape: 'diamond',
                size: 8,
                color: { background: c, border: c, highlight: { background: '#fde68a', border: '#fbbf24' } },
                font: { color: '#94a3b8', size: 9 }

        }

    const badges = [
        `<span class="badge ugl">${modelo.ugls.length} UGLs</span>`,

    aristasDS = new vis.DataSet(aristas);

        nodes: { borderWidth: 1.5, shadow: { enabled: true, color: 'rgba(0,0,0,.6)', size: 4 } },
        edges: { width: 0.8, smooth: false, color: { highlight: '#3b82f6', hover: '#3b82f6' } },
        physics: {
            solver: 'forceAtlas2Based',
            forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.008, springLength: 80, springConstant: 0.06, avoidOverlap: 0.4 },

}

function seleccionar(id, enfocar = true) {
    const obj = indice.get(id);
    if (!obj) return;
    if (enfocar && red) {
        red.selectNodes([id]);
        red.focus(id, { scale: obj.tipo === 'ugl' ? 1.3 : 1.8, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    }
    if (obj.tipo === 'central') {
        document.getElementById('contenido-detalles').innerHTML = '<div class="mensaje-vacio">Nivel Central institucional seleccionado.</div>';
    } else if (obj.tipo === 'ugl') mostrarUGL(obj);
    else mostrarDependencia(obj);
}

}

document.getElementById('buscador').addEventListener('input', e => {

        if (motivo) res.push({ id, o, nombre, motivo });

/* ---------- Divisor arrastrable (ancho del panel) ---------- */
(function () {
    const divisor = document.getElementById('divisor');
    const panel = document.getElementById('panel-lateral');
    const MIN = 300, maxAncho = () => Math.max(MIN, window.innerWidth * 0.7);
    const aplicar = w => { panel.style.width = Math.min(maxAncho(), Math.max(MIN, w)) + 'px'; if (red) red.redraw(); };
    try { const g = parseInt(localStorage.getItem('anchoPanel'), 10); if (g) aplicar(g); } catch (e) {}

    divisor.addEventListener('pointerdown', e => {
        e.preventDefault();
        divisor.setPointerCapture(e.pointerId);
        divisor.classList.add('activo'); document.body.classList.add('redimensionando');
    });
    divisor.addEventListener('pointermove', e => {
        if (!divisor.classList.contains('activo')) return;
        aplicar(window.innerWidth - e.clientX);
    });
    const soltar = e => {
        if (!divisor.classList.contains('activo')) return;
        divisor.classList.remove('activo'); document.body.classList.remove('redimensionando');
        try { divisor.releasePointerCapture(e.pointerId); } catch (_) {}
        try { localStorage.setItem('anchoPanel', parseInt(panel.style.width, 10)); } catch (_) {}
    };
    divisor.addEventListener('pointerup', soltar);
    divisor.addEventListener('pointercancel', soltar);
    divisor.addEventListener('dblclick', () => { panel.style.width = '420px'; if (red) red.redraw(); try { localStorage.removeItem('anchoPanel'); } catch (_) {} });
    window.addEventListener('resize', () => { if (panel.style.width) aplicar(parseInt(panel.style.width, 10)); });
})();

/* ---------- Buscador rápido: UGL, localidad o Agencia -> zoom al nodo ---------- */
(function () {
    const input = document.getElementById('busquedaRapida');
    const caja = document.getElementById('sugerencias');
    let items = [], activa = -1;

    function candidatos(q) {
        const res = [];
        for (const [id, o] of indice) {
            if (o.tipo === 'central') continue;
            let texto, extra = '', puntos = null;
            if (o.tipo === 'ugl') {
                texto = `UGL ${o.num} – ${o.nombre}`;
                const terminos = [o.nombre, 'UGL ' + o.num, ...o.claves];
                for (const t of terminos) {
                    const k = clave(t);
                    if (k === q || ('UGL ' + clave(o.num)) === q) { puntos = 0; break; }
                    if (k.startsWith(q)) puntos = Math.min(puntos ?? 9, 1);
                    else if (k.includes(q)) puntos = Math.min(puntos ?? 9, 3);
                }
            } else {
                texto = o.nombre;
                extra = (o.subtipo || 'Agencia') + ' · UGL ' + o.ugl.num;
                const k = clave(o.nombre);
                if (k === q) puntos = 0.5; else if (k.startsWith(q)) puntos = 2; else if (k.includes(q)) puntos = 4;
            }
            if (puntos !== null) res.push({ id, o, texto, extra: extra || 'UGL', puntos });
        }
        return res.sort((a, b) => a.puntos - b.puntos || a.texto.localeCompare(b.texto)).slice(0, 12);
    }

    function pintar() {
        const q = clave(input.value);
        if (!q || !modelo) { caja.classList.remove('visible'); return; }
        items = candidatos(q); activa = items.length ? 0 : -1;
        caja.innerHTML = items.length
            ? items.map((it, i) => `<div class="sug${i === activa ? ' activa' : ''}" data-i="${i}">
                    <span class="sw ${it.o.tipo}"></span><span class="txt">${esc(it.texto)}</span><small>${esc(it.extra)}</small></div>`).join('')
            : '<div class="sug-vacio">Sin coincidencias</div>';
        caja.classList.add('visible');
    }

    function ir(i) {
        const it = items[i];
        if (!it) return;
        // Si el tipo está oculto por el filtro de la leyenda, lo volvemos a mostrar
        if (it.o.tipo === 'agencia' && !document.getElementById('chkAgencias').checked) { document.getElementById('chkAgencias').checked = true; aplicarFiltros(); }
        seleccionar(it.id, true);
        input.value = it.texto;
        caja.classList.remove('visible');
        input.blur();
    }

    function marcar(n) {
        if (!items.length) return;
        activa = (n + items.length) % items.length;
        caja.querySelectorAll('.sug').forEach((el, i) => el.classList.toggle('activa', i === activa));
        caja.querySelector('.sug.activa')?.scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('input', pintar);
    input.addEventListener('focus', () => { if (input.value) { input.select(); pintar(); } });
    input.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); marcar(activa + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); marcar(activa - 1); }
        else if (e.key === 'Enter') { e.preventDefault(); ir(activa); }
        else if (e.key === 'Escape') { caja.classList.remove('visible'); input.blur(); }
    });
    caja.addEventListener('mousedown', e => {           // mousedown: se dispara antes del blur
        const el = e.target.closest('.sug');
        if (el) { e.preventDefault(); ir(+el.dataset.i); }
    });
    input.addEventListener('blur', () => setTimeout(() => caja.classList.remove('visible'), 120));
    // Atajo: "/" enfoca el buscador rápido
    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); input.focus(); }
    });
})();

/* ---------- Intro: se cierra cuando pasó la animación Y el grafo está listo ---------- */
const intro = (function () {
    const el = document.getElementById('intro');
    const DURACION_MIN = 3000, DURACION_MAX = 7000;
    let animacionLista = false, grafoListo = false, cerrado = false;
    const cerrar = () => {
        if (cerrado) return; cerrado = true;
        el.classList.add('salida');
        setTimeout(() => el.remove(), 800);
    };
    const probar = () => { if (animacionLista && grafoListo) cerrar(); };
    setTimeout(() => { animacionLista = true; probar(); }, DURACION_MIN);
    setTimeout(cerrar, DURACION_MAX);                       // por si falla la carga
    el.addEventListener('click', cerrar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
    return { listo: () => { grafoListo = true; probar(); } };
})();

window.onload = inicializar;
</script>
